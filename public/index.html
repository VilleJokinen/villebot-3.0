<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>VilleBot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Cpath d='M12 9v11.2a3.5 3.5 0 1 0 2 3.1V13l8-2v6.2a3.5 3.5 0 1 0 2 3.1V7z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="expired" class="expired" hidden>
  <p>Session expired or missing. Open the panel with ?token=YOUR_PANEL_TOKEN</p>
</div>

<header class="topbar">
  <h1>VilleBot</h1>
  <span id="conn" class="conn" data-state="connecting" role="status"><i></i><span id="conn-text">Connecting…</span></span>
  <div class="pickers">
    <label id="guild-wrap" class="field" hidden>
      <span class="sr">Server</span>
      <select id="guild"></select>
    </label>
    <label class="field">
      <span class="sr">Voice channel</span>
      <select id="channel"></select>
    </label>
    <button id="join" class="btn primary" type="button">Join</button>
    <button id="leave" class="btn" type="button">Leave</button>
  </div>
</header>

<main class="layout">
  <div class="col-left">
    <section id="np" class="card np" aria-label="Now playing">
      <div id="np-empty" class="empty">Nothing playing. Search or paste a link below.</div>
      <div id="np-body" hidden>
        <div class="np-main">
          <img id="np-thumb" class="thumb big" alt="" width="160" height="90">
          <div class="np-text">
            <a id="np-title" class="title" target="_blank" rel="noopener noreferrer"></a>
            <div id="np-channel" class="muted"></div>
            <div id="np-req" class="muted small"></div>
          </div>
        </div>
        <div class="progress">
          <div id="bar" class="bar"><div id="bar-fill"></div></div>
          <div id="time" class="time">0:00 / 0:00</div>
        </div>
      </div>
      <div class="controls" id="controls">
        <button id="c-pause" class="btn icon" type="button" aria-label="Pause">⏸</button>
        <button id="c-skip" class="btn icon" type="button" aria-label="Skip">⏭</button>
        <button id="c-stop" class="btn icon" type="button" aria-label="Stop and clear queue">⏹</button>
        <button id="c-loop" class="btn" type="button">Loop: off</button>
        <label class="vol">
          <span aria-hidden="true">🔊</span>
          <input id="c-vol" type="range" min="0" max="100" step="1" value="50" aria-label="Volume">
          <output id="c-vol-out">50</output>
        </label>
      </div>
    </section>

    <section class="card search" aria-label="Search">
      <form id="search-form" class="search-form" autocomplete="off">
        <input id="q" type="search" placeholder="Search YouTube or paste a link" enterkeyhint="search" aria-label="Search or URL">
        <button id="q-go" class="btn primary" type="submit">Search</button>
      </form>
      <div id="url-actions" class="url-actions" hidden>
        <button id="u-now" class="btn primary" type="button">Play now</button>
        <button id="u-queue" class="btn" type="button">Add to queue</button>
      </div>
      <div id="search-status" class="muted small" role="status"></div>
      <ul id="results" class="list results"></ul>
    </section>
  </div>

  <section class="card queue" aria-label="Queue">
    <div class="queue-head">
      <h2>Queue</h2>
      <span id="queue-meta" class="muted small"></span>
    </div>
    <ul id="queue" class="list"></ul>
    <div id="queue-empty" class="empty" hidden>Queue is empty.</div>
  </section>
</main>

<div id="toasts" class="toasts" role="alert" aria-live="assertive"></div>
</body>
</html>
